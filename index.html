<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio pribadi Muhammad Dafa Hambali - System Analyst & Full-Stack Developer. Built with Vue and Vite." />
    <title>Muhammad Dafa Hambali — System Analyst & Developer</title>
    <script>
      // Setel tema sebelum paint supaya tidak ada kedip putih/kilat.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme = saved || (prefersLight ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
